<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quran & Hadith Reader</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="brandGold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f0d78c"/>
                <stop offset="55%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#a8841f"/>
              </linearGradient>
            </defs>
            <path fill="none" stroke="url(#brandGold)" stroke-width="2.6" stroke-linejoin="round"
              d="M32 4 L39.5 17 L54 17 L42.5 28.5 L48.5 44 L32 36 L15.5 44 L21.5 28.5 L10 17 L24.5 17 Z"/>
            <path fill="none" stroke="url(#brandGold)" stroke-width="2.2" stroke-linejoin="round"
              d="M32 12 L48 32 L32 52 L16 32 Z"/>
            <rect x="25" y="25" width="14" height="14" rx="1.5"
              transform="rotate(45 32 32)"
              fill="none" stroke="url(#brandGold)" stroke-width="2"/>
            <circle cx="32" cy="32" r="3.2" fill="#d4af37"/>
          </svg>
          <h1>Quran &amp; Hadith</h1>
        </div>

        <nav class="mode-toggle" role="tablist" aria-label="Content mode">
          <button type="button" class="mode-btn active" data-mode="quran" role="tab" aria-selected="true">Quran</button>
          <button type="button" class="mode-btn" data-mode="hadith" role="tab" aria-selected="false">Hadith</button>
        </nav>

        <div class="controls">
          <button type="button" id="translation-btn" class="picker-btn" title="Select translation">
            <span class="picker-label">Translation</span>
            <span id="translation-name">Saheeh International</span>
          </button>

          <label class="search-wrap">
            <span class="sr-only">Search</span>
            <input id="search-input" type="search" placeholder="Search…" autocomplete="off" spellcheck="false" />
          </label>
        </div>
      </header>

      <div id="nav-bar" class="nav-bar hidden">
        <button type="button" id="back-btn" class="back-btn" aria-label="Go back">← Back</button>
        <p id="nav-path" class="nav-path"></p>
      </div>

      <div id="status" class="status" aria-live="polite">Loading…</div>

      <main id="list-viewport" class="list-viewport" tabindex="0">
        <div id="list-spacer" class="list-spacer">
          <div id="list-window" class="list-window"></div>
        </div>
      </main>
    </div>

    <!-- Translation picker -->
    <div id="trans-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="trans-title">
      <div class="panel">
        <div class="panel-head">
          <h2 id="trans-title">Select translation</h2>
          <button type="button" class="icon-btn" id="trans-close" aria-label="Close">×</button>
        </div>
        <input id="trans-search" type="search" placeholder="Search English translations…" autocomplete="off" />
        <div id="trans-list" class="picker-list"></div>
      </div>
    </div>

    <!-- Copy panel -->
    <div id="copy-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="copy-title">
      <div class="panel copy-panel">
        <div class="panel-head">
          <h2 id="copy-title">Copy</h2>
          <button type="button" class="icon-btn" id="copy-close" aria-label="Close">×</button>
        </div>
        <p id="copy-ref" class="copy-ref"></p>
        <div class="copy-preview">
          <p id="copy-arabic" class="arabic preview-ar" dir="rtl" lang="ar"></p>
          <p id="copy-translation" class="preview-tr"></p>
        </div>
        <div class="copy-options">
          <label class="check"><input type="checkbox" id="copy-ar-cb" checked /> <span id="copy-ar-label">Arabic</span></label>
          <label class="check"><input type="checkbox" id="copy-tr-cb" checked /> <span id="copy-tr-label">Translation</span></label>
        </div>
        <div class="copy-actions">
          <button type="button" class="gold-btn" id="copy-btn">Copy</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
