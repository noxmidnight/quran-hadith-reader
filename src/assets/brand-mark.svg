<!-- Islamic 8-pointed star (Rub el Hizb style) brand mark -->
<svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="brandGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8841f"/>
    </linearGradient>
  </defs>
  <!-- Outer octagram -->
  <path fill="none" stroke="url(#brandGold)" stroke-width="2.4" stroke-linejoin="round"
    d="M32 4 L40 16 L56 16 L44 28 L52 44 L32 36 L12 44 L20 28 L8 16 L24 16 Z"/>
  <!-- Inner diamond -->
  <path fill="none" stroke="url(#brandGold)" stroke-width="2" stroke-linejoin="round"
    d="M32 14 L46 32 L32 50 L18 32 Z"/>
  <!-- Center square rotated -->
  <rect x="26" y="26" width="12" height="12" rx="1.5"
    transform="rotate(45 32 32)"
    fill="none" stroke="url(#brandGold)" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="3" fill="#d4af37"/>
</svg>
